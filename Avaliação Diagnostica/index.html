<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre Mim</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
        }

        header {
            background-color: #0077cc;
            color: white;
            text-align: center;
            padding: 20px;
        }

        main {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
        }

        img {
            display: block;
            margin: 20px auto;
            border-radius: 10px;
            width: 200px;
        }

        form {
            margin-top: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            background-color: #0077cc;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }

        button:hover {
            background-color: #005fa3;
        }

        footer {
            background-color: #0077cc;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sobre Mim</h1>
    </header>

    <main>

        <h2>Quem sou eu?</h2>

        <p>
            Meu nome é Gabriel mais conhecido como Somaggio. Sou estudante do terceiro ano do médio do SESI estou cursando SENAI DS e gosto de aprender programação,
            tecnologia e desenvolvimento web.
        </p>

        <img src="2B9A54DA-B843-45D2-BC5B-99CFC628E5D1_VSCO.jpg" alt="Minha foto">

        <h2>Entre em contato</h2>

        <form id="formContato">

            <label>Nome:</label>
            <input type="text" id="nome">

            <label>E-mail:</label>
            <input type="email" id="email">

            <button type="submit">Enviar</button>

        </form>

    </main>

    <footer>
        <p>© 2026 - Minha Página Pessoal</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
