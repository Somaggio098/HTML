<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body{
            background-color: lightpink;
            padding: 100px;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
            font-weight: bold;

        }
        h1{
            color:green
        }
        a {
            color:blue;
            text-decoration: none;
        }
        a:visited {
            color:purple;
        }
        a:hover {
            color:red;
            text-decoration: underline;
            font-size: 100px;
        }
        a:active {
            color:orange;
        }
    </style>

    </head>
    <body>
        <h1>Formatação de links com CSS</h1>
        <p><a href="#">Formação de links</a></p>
